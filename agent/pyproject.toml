[project]
name = "ulp-helper"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "langchain-core>=1.8.0",
    "langchain-google-genai>=4.5.0",
    "langchain-postgres>=0.0.19",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.20",
    "langgraph-cli[inmem]>=0.4.42",
    "psycopg[binary,pool]>=3.3.9",
    "pypdf>=7.0.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
